<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Transport Booking App</title>
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="header-container">
      <a href="./index.html" class="brand-link">
        <span class="brand-icon">🚕</span>
        <span>CampusRide</span>
      </a>
      <nav class="nav-actions">
        <a href="./register.html" class="nav-link">Create Account</a>
      </nav>
    </div>
  </header>

  <!-- Login Form Wrapper -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-badge">Authentication</span>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to access your student or provider portal</p>
      </div>

      <!-- Feedback / Alert Banner -->
      <div id="alertBox" class="alert hidden" role="alert"></div>

      <form id="loginForm" novalidate>
        <!-- Email Field -->
        <div class="form-group">
          <label for="email" class="form-label">Email Address <span class="required">*</span></label>
          <input 
            type="email" 
            id="email" 
            class="form-control" 
            placeholder="e.g. user@example.com" 
            required 
            autocomplete="email"
          >
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password" class="form-label">Password <span class="required">*</span></label>
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="btn btn-primary btn-block">
          Sign In
        </button>

        <div style="display: flex; align-items: center; margin: 1.25rem 0; color: var(--text-muted); font-size: 0.85rem;">
          <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
          <span style="padding: 0 0.75rem;">or</span>
          <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
        </div>

        <!-- Google Login Button -->
        <button type="button" id="googleBtn" class="btn btn-secondary btn-block" style="gap: 0.65rem;">
          <svg width="18" height="18" viewBox="0 0 18 18">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
            <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.347 2.825.957 4.039l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
          </svg>
          Sign in with Google
        </button>
      </form>

      <!-- Navigation Footer -->
      <div class="auth-footer">
        Don't have an account yet? 
        <a href="./register.html">Create one here</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 CampusRide Transport Booking App</p>
  </footer>

  <!-- Login Script -->
  <script type="module" src="./js/login.js"></script>
</body>
</html>
